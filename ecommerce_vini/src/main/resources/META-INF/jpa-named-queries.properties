ordine.searchByVenditore=SELECT DISTINCT o \
  FROM Ordine o \
  WHERE (:data IS NULL OR o.data_ordine = :data) \
    AND (:totale IS NULL OR o.totale = :totale) \
    AND (:id_status IS NULL OR o.status.id = :id_status) \
    AND (:id_utente IS NULL OR o.utente.id = :id_utente) \
    AND (:indirizzo_destinazione IS NULL OR o.indirizzoDestinazione LIKE CONCAT(CAST(:indirizzo_destinazione AS string), '%')) \
    AND (:id_venditore IS NULL OR EXISTS ( \
          SELECT 1 FROM OrdineAlcolico oa WHERE oa.ordine = o AND oa.cantina.venditore.id = :id_venditore) \
        OR EXISTS ( \
          SELECT 1 FROM OrdineBox ob WHERE ob.ordine = o AND ob.cantina.venditore.id = :id_venditore) \
        OR EXISTS ( \
          SELECT 1 FROM OrdineDegustazione od WHERE od.ordine = o AND od.cantina.venditore.id = :id_venditore))
          
