ratingAlc.searchByFilter=SELECT r FROM RatingAlcolico r \
  WHERE (:alcolico IS NULL OR LOWER(r.alcolico.nome) LIKE LOWER(CONCAT('%', CAST(:alcolico AS string), '%'))) \
  AND (:utente IS NULL OR r.cliente.id = :utente) \
  AND (:valutazione IS NULL OR r.valutazione = :valutazione)

ordine.searchWithParameters=SELECT DISTINCT o \
  FROM Ordine o \
  WHERE (:data IS NULL OR o.data_ordine = :data) \
    AND (:totale IS NULL OR o.totale = :totale) \
    AND (:id_status IS NULL OR o.status.id = :id_status) \
    AND (:id_utente IS NULL OR o.utente.id = :id_utente) \
    AND (:indirizzo_destinazione IS NULL OR o.indirizzoDestinazione LIKE CONCAT(CAST(:indirizzo_destinazione AS string), '%'))

    
ordineAlcolico.searchWithParameters=SELECT DISTINCT oa \
  FROM OrdineAlcolico oa \
  WHERE (:quantita IS NULL OR oa.quantita = :quantita) \
    AND (:id_ordine IS NULL OR oa.ordine.id = :id_ordine) \
    AND (:id_status IS NULL OR oa.status.id = :id_status) \
    AND (:id_alcolico IS NULL OR oa.alcolico.id = :id_alcolico) \
    AND (:id_cantina IS NULL OR oa.cantina.id = :id_cantina) 
    
ratingCant.searchByFilter=SELECT r FROM RatingCantina r \
  WHERE (:cantina IS NULL OR LOWER(r.cantina.nome) LIKE LOWER(CONCAT('%', CAST(:cantina AS string), '%'))) \
  AND (:utente IS NULL OR r.cliente.id = :utente) \
  AND (:valutazione IS NULL OR r.valutazione = :valutazione)
  

status.searchWithParameters=SELECT DISTINCT s \
  FROM Status s \
  WHERE (:nome IS NULL OR s.nome LIKE CONCAT(:nome, '%')) \
    AND (:descrizione IS NULL OR s.descrizione LIKE CONCAT(:descrizione, '%'))
    
spedizioneAlcolico.searchWithParameters=SELECT DISTINCT sa \
  FROM SpedizioneAlcolico sa \
  WHERE (:corriere IS NULL OR sa.corriere LIKE CONCAT(CAST(:corriere AS string), '%')) \
    AND (:codice_tracciamento IS NULL OR sa.codice_tracciamento LIKE CONCAT(CAST(:codice_tracciamento AS string), '%')) \
    AND (:id_cantina IS NULL OR sa.cantina.id = :id_cantina) \
    AND (:id_cliente IS NULL OR sa.cliente.id = :id_cliente) \
    AND (:id_status IS NULL OR sa.status.id = :id_status) \
    AND (:id_ordine_alcolico IS NULL OR sa.ordineAlcolico.id = :id_ordine_alcolico)
    
spedizioneBox.searchWithParameters=SELECT DISTINCT sb \
  FROM SpedizioneBox sb \
  WHERE (:corriere IS NULL OR sb.corriere LIKE CONCAT(CAST(:corriere AS string), '%')) \
    AND (:codice_tracciamento IS NULL OR sb.codice_tracciamento LIKE CONCAT(CAST(:codice_tracciamento AS string), '%')) \
    AND (:id_cantina IS NULL OR sb.cantina.id = :id_cantina) \
    AND (:id_cliente IS NULL OR sb.cliente.id = :id_cliente) \
    AND (:id_status IS NULL OR sb.status.id = :id_status) \
    AND (:id_ordine_box IS NULL OR sb.ordineBox.id = :id_ordine_box)
    
prenotazioneDegustazione.searchWithParameters=SELECT DISTINCT pd \
  FROM PrenotazioneDegustazione pd \
  WHERE (:id_ordine IS NULL OR pd.ordine.id = :id_ordine) \
    AND (:id_degustazione IS NULL OR pd.degustazione.id = :id_degustazione) \
    AND (:id_status IS NULL OR pd.status.id = :id_status) \
    AND (:id_cantina IS NULL OR pd.cantina.id = :id_cantina)
    
boxAlcolico.searchByFilter=SELECT DISTINCT ba \
  FROM BoxAlcolico ba \
  LEFT JOIN ba.box.listOrdineBox ob \
  WHERE (:quantita IS NULL OR ba.quantita = :quantita) \
    AND (:id_ordine IS NULL OR ob.ordine.id = :id_ordine) \
    AND (:id_status IS NULL OR ob.status.id = :id_status) \
    AND (:id_alcolico IS NULL OR ba.alcolico.id = :id_alcolico) \
    AND (:id_cantina IS NULL OR ba.box.cantina.id = :id_cantina)
    
box.searchByFilter=SELECT DISTINCT b \
  FROM Box b \
  WHERE (:nome IS NULL OR b.nome LIKE :nome) \
    AND (:id_cantina IS NULL OR b.cantina.id = :id_cantina)
 
imgdeg.searchWithParameters=SELECT DISTINCT id \
  FROM ImmagineDegustazione id \
  WHERE (:id_cantina IS NULL OR id.degustazione.cantina.id = :id_cantina)
 
utente.searchByFilter=SELECT u FROM Utente u WHERE \
    (:nome IS NULL OR u.nome LIKE CONCAT('%', CAST(:nome AS string), '%')) AND \
    (:cognome IS NULL OR u.cognome LIKE CONCAT('%', CAST(:cognome AS string), '%')) AND \
    (:email IS NULL OR u.email LIKE CONCAT('%', CAST(:email AS string), '%')) AND \
    (:dataNascita IS NULL OR u.dataNascita = :dataNascita) AND \
    (:ruolo IS NULL OR u.ruolo.nome LIKE CONCAT('%', CAST(:ruolo AS string), '%'))
 
 cliente.searchByFilter=SELECT c FROM Cliente c WHERE \
 (:indirizzo IS NULL OR c.indirizzo LIKE :indirizzo%)
   
alcolico.searchByFilter=SELECT DISTINCT a \
  FROM Alcolico a \
  WHERE (:idColore IS NULL OR a.colore.id = :idColore) \
    AND (:idTipologia IS NULL OR a.tipologia_alcolico.id = :idTipologia) \
    AND (:nome IS NULL OR LOWER(a.nome) LIKE LOWER(CONCAT('%', CAST(:nome AS string), '%'))) \
    AND (:gradazione IS NULL OR a.gradazione = :gradazione) \
    AND (:annata IS NULL OR a.annata = :annata)

ordineBox.searchWithParameters=SELECT DISTINCT ob \
  FROM OrdineBox ob \
  WHERE (:quantita IS NULL OR ob.quantita = :quantita) \
    AND (:id_ordine IS NULL OR ob.ordine.id = :id_ordine) \
    AND (:id_status IS NULL OR ob.status.id = :id_status) \
    AND (:id_box IS NULL OR ob.box.id = :id_box) \
    AND (:id_cantina IS NULL OR ob.cantina.id = :id_cantina)

ordineDegustazione.searchWithParameters=SELECT DISTINCT od \
  FROM OrdineDegustazione od \
  WHERE (:quantita IS NULL OR od.quantita = :quantita) \
    AND (:id_ordine IS NULL OR od.ordine.id = :id_ordine) \
    AND (:id_status IS NULL OR od.status.id = :id_status) \
    AND (:id_degustazione IS NULL OR od.degustazione.id = :id_degustazione) \
    AND (:id_cantina IS NULL OR od.cantina.id = :id_cantina)
    
cantina.searchByFilter=SELECT DISTINCT c \
  FROM Cantina c \
  WHERE (:nome IS NULL OR LOWER(c.nome) LIKE LOWER(CONCAT(CAST(:nome AS string), '%'))) \
    AND (:idVenditore IS NULL OR c.venditore.id = :idVenditore)
    
    
cantinaAlcolico.searchByFilter=SELECT DISTINCT ca \
  FROM CantinaAlcolico ca \
  WHERE (:idCantina IS NULL OR ca.cantina.id = :idCantina) \
    AND (:idAlcolico IS NULL OR ca.alcolico.id = :idAlcolico)

degustazione.searchWithParameters=SELECT DISTINCT d \
FROM Degustazione d \
WHERE (:nome IS NULL OR LOWER(d.nome) LIKE LOWER(CAST(CONCAT('%', :nome, '%') AS text))) \
  AND (:descrizione IS NULL OR LOWER(d.descrizione) LIKE LOWER(CAST(CONCAT('%', :descrizione, '%') AS text))) \
  AND (:prezzo IS NULL OR d.prezzo = :prezzo) \
  AND (CAST(:data_inizio AS timestamp) IS NULL OR d.dataInizio = :data_inizio) \
  AND (CAST(:data_fine AS timestamp) IS NULL OR d.dataFine = :data_fine) \
  AND (:id_cantina IS NULL OR d.cantina.id = :id_cantina)

immagineAlcolico.searchWithParameters=SELECT DISTINCT ia \
  FROM ImmagineAlcolico ia \
  WHERE (:idAlcolico IS NULL OR ia.alcolico.id = :idAlcolico)

immagineBox.searchWithParameters=SELECT DISTINCT ib \
  FROM ImmagineBox ib \
  WHERE (:idBox IS NULL OR ib.box.id = :idBox)

immagineCantina.searchWithParameters=SELECT DISTINCT ic \
  FROM ImmagineCantina ic \
  WHERE (:idCantina IS NULL OR ic.cantina.id = :idCantina)

posizione.searchByFilter=SELECT DISTINCT p \
  FROM Posizione p \
  WHERE (:descrizione IS NULL OR LOWER(p.descrizione) LIKE LOWER(CONCAT('%', :descrizione, '%')))
  
prodottoAlcolico.searchByFilter=SELECT p FROM ProdottoAlcolico p WHERE (:idAlcolico IS NULL OR p.alcolico.id = :idAlcolico) AND (:idCarrello IS NULL OR p.carrello.id = :idCarrello)
    
prodottoBox.searchByFilter=SELECT p FROM ProdottoBox p WHERE (:idBox IS NULL OR p.box.id = :idBox) AND (:idCarrello IS NULL OR p.carrello.id = :idCarrello)
  
prodottoDegustazione.searchByFilter=SELECT p FROM ProdottoDegustazione p WHERE (:idDegustazione IS NULL OR p.degustazione.id = :idDegustazione) AND (:idCarrello IS NULL OR p.carrello.id = :idCarrello)

